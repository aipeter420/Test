<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2f4f6">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@600;700&display=swap" rel="stylesheet">
<title>Clip Assistant</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<style>
:root{--bg:#f2f4f6;--sf:#fff;--ink:#14181d;--mut:#667180;--bd:#e0e4e9;--ac:#ffd23f;--pri:#0f766e;--r:16px}
@media(prefers-color-scheme:dark){:root{--bg:#0f1216;--sf:#181c22;--ink:#eef1f4;--mut:#97a1ad;--bd:#2a313a;--pri:#2dd4bf}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans Thai",system-ui,sans-serif}
#app{max-width:560px;margin:auto;min-height:100vh;padding:0 14px 170px}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 2px 8px}
header b{font:700 20px Prompt,sans-serif}
h3{font:600 17px Prompt,sans-serif;margin:.2em 0 .5em}
small{color:var(--mut);font-size:13px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin:10px 0}
input,textarea,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;width:100%;margin:4px 0}
input[type=checkbox]{width:auto;accent-color:var(--pri)}
button{font:600 15px "Noto Sans Thai",sans-serif;background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:11px 16px;cursor:pointer}
button:disabled{opacity:.4}
button.g{background:transparent;color:var(--ink);border:1px solid var(--bd)}
button.main{background:var(--ac);color:#14181d;width:100%;padding:15px;font-size:17px;border-radius:14px}
button.main:disabled{opacity:.55}
.sm{padding:6px 12px;font-size:14px}
.row{display:flex;gap:8px}.row>*{flex:1}
.rw{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:2px 10px;font-size:13px;white-space:nowrap}
.pill.shooting{background:#fde68a;color:#14181d;border:0}.pill.editing{background:#bfdbfe;color:#14181d;border:0}.pill.posted{background:#bbf7d0;color:#14181d;border:0}
.empty{color:var(--mut);text-align:center;padding:26px 8px}
video{width:100%;border-radius:12px;background:#000;margin-top:8px}
summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
details[open]>summary{margin-bottom:8px}
.drop{display:grid;gap:4px;place-items:center;text-align:center;border:2px dashed var(--bd);border-radius:var(--r);padding:26px 12px;background:var(--sf);cursor:pointer}
.drop b{font:600 18px Prompt,sans-serif}
.f{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}.f:first-child{border-top:0}
.fn{flex:1;min-width:0}
.n{width:26px;height:26px;border-radius:50%;background:var(--ac);color:#14181d;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.chips,.scroll{display:flex;gap:8px;flex-wrap:wrap}.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.chip{background:var(--sf);color:var(--ink);border:1.5px solid var(--bd);border-radius:999px;padding:8px 16px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sty{display:grid;gap:2px;place-items:center;height:70px;border:2px solid transparent;border-radius:12px;background:linear-gradient(135deg,#59606b,#1f2937);color:#fff;padding:4px}
.sty.on{border-color:var(--ac)}.sty em{font-style:normal;font-size:12px;font-weight:500;opacity:.85}
.s-def{font-weight:700;text-shadow:0 0 3px #000,0 0 3px #000}
.s-yellow{color:#ffe600;font-weight:700;text-shadow:0 0 3px #000,0 0 3px #000}
.s-box{background:rgba(0,0,0,.7);padding:1px 8px;font-weight:700}
.s-big{font-size:21px;font-weight:800;text-shadow:0 0 4px #000,0 0 4px #000}
.sw{font-size:14px;color:var(--mut)}
.st{padding:10px 4px;color:var(--mut);font-size:14px}
.st.busy::before{content:"";display:inline-block;width:12px;height:12px;border:2px solid var(--bd);border-top-color:var(--ink);border-radius:50%;margin-right:8px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.st.busy::before{animation:none}}
.dock{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));padding:24px 14px 8px;background:linear-gradient(transparent,var(--bg) 45%);max-width:560px;margin:auto}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px);z-index:5}
.tabs button{flex:1;background:none;color:var(--mut);display:grid;justify-items:center;gap:2px;font-size:12px;padding:4px 0}
.tabs button.on{color:var(--ink)}
.tabs i{display:grid;place-items:center;width:54px;height:30px;border-radius:15px}
.tabs button.on i{background:var(--ac);color:#14181d}
.bn{background:var(--ac);color:#14181d;border-radius:12px;padding:10px 14px;margin:6px 0;font-size:14px;font-weight:600;cursor:pointer}.bn[hidden]{display:none}
.login{padding-top:16vh}.login h1{font:700 30px Prompt,sans-serif;margin:0 0 6px}.login p{color:var(--mut);margin:0 0 16px}
</style></head><body>
<div id="app"></div>
<script>
// ====== ใส่ค่าของโปรเจกต์ Supabase ======
let _c={};try{_c=JSON.parse(localStorage.getItem('cfg')||'{}')}catch(e){}
const SUPABASE_URL=_c.u||'https://YOUR-PROJECT.supabase.co', SUPABASE_KEY=_c.k||'YOUR-ANON-KEY';
// ========================================
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY), $=s=>document.querySelector(s);
const S={tab:'auto',products:[],clips:[],cur:null,shots:[]};
window.addEventListener('unhandledrejection',e=>{if(S.busy)setMsg('ผิดพลาด: '+errMsg(e.reason))});
S.opt={tl:'60',vol:'1',tp:'def',ps:'bot',sz:'m',apid:'',as:true,act:'กดตะกร้าเหลืองด้านล่างได้เลย',lg:'thai',md:'Xenova/whisper-base'};
window.addEventListener('beforeunload',e=>{if(S.busy){e.preventDefault();e.returnValue=''}});
const STATUS=['idea','shooting','editing','posted'];
const esc=t=>(t??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function setupUI(){
  $('#app').innerHTML=`<div class=login><h1>ตั้งค่าครั้งแรก</h1><p>ใส่ค่าจาก Supabase → Project Settings → API (Project URL และ anon public key) ระบบจะจำไว้ในเครื่องนี้</p>
  <input id=cu placeholder="https://xxxx.supabase.co"><input id=ck placeholder="anon public key"><button class=main onclick="localStorage.setItem('cfg',JSON.stringify({u:$('#cu').value.trim(),k:$('#ck').value.trim()}));location.reload()">บันทึก</button></div>`;
}
async function init(){
  if(/YOUR-PROJECT|YOUR-ANON-KEY/.test(SUPABASE_URL+SUPABASE_KEY))return setupUI();
  const{data:{session}}=await sb.auth.getSession();
  session?load():loginUI();
}
function loginUI(){
  $('#app').innerHTML=`<div class=login><h1>Clip Assistant</h1><p>โยนคลิปดิบเข้ามา ได้คลิปขายของพร้อมซับกลับไป</p>
  <input id=e type=email placeholder="อีเมล" autocomplete=email><input id=p type=password placeholder="รหัสผ่าน (6 ตัวขึ้นไป)" autocomplete=current-password>
  <button class=main onclick="auth('in')">เข้าสู่ระบบ</button><button class=g style="width:100%;margin-top:8px" onclick="auth('up')">สมัครบัญชีใหม่</button></div>`;
}
async function auth(m){
  const c={email:$('#e').value,password:$('#p').value};
  const{error}=m=='in'?await sb.auth.signInWithPassword(c):await sb.auth.signUp(c);
  error?alert(error.message):load();
}
async function load(){
  const[a,b]=await Promise.all([sb.from('products').select('*').order('created_at',{ascending:false}),
    sb.from('clips').select('*').order('created_at',{ascending:false})]);
  S.products=a.data||[];S.clips=b.data||[];render();
}
const TABS=[['auto','ออโต้','<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>'],['clips','คลิปของฉัน','<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M16 4v16M3 12h18"/>'],['products','สินค้า','<path d="M3 12V3h9l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/>'],['edit','ตัดต่อเอง','<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.5 8 20 19M8.5 16 20 5"/>']];
const ST={idea:'ไอเดีย',shooting:'กำลังถ่าย',editing:'ตัดต่อ',posted:'โพสต์แล้ว'};
function render(){
  $('#app').innerHTML=`<header><b>Clip Assistant</b><button class="g sm" onclick="sb.auth.signOut().then(loginUI)">ออกจากระบบ</button></header><div id=bn class=bn hidden onclick="bnGo()"></div><main id=v></main>
  <nav class=tabs>${TABS.map(([k,l,d])=>`<button class="${S.tab==k?'on':''}" onclick="S.tab='${k}';render()"><i><svg viewBox="0 0 24 24" width=22 height=22 fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round>${d}</svg></i>${l}</button>`).join('')}</nav>`;
  ({products:pView,clips:cView,auto:aView,edit:eView})[S.tab]();banner();
}
function goClips(){S.tab='clips';S.cur=null;render()}
function bnGo(){S.note=false;S.busy?(S.tab='auto',render()):goClips()}
function banner(){
  if(S.tab=='auto'||(S.tab=='clips'&&!S.busy))S.note=false;
  const b=$('#bn');if(!b)return;const show=S.busy||S.note;b.hidden=!show;
  if(show)b.textContent=(S.busy?'⏳ กำลังทำคลิป · ':'✓ ')+(S.msg||'')+(S.busy?' (แตะเพื่อดู)':' (แตะเพื่อไปที่คลิปของฉัน)');
}
function setMsg(t){S.msg=t;const a=$('#am');if(a){a.textContent=t;a.classList.toggle('busy',!!S.busy)}banner()}
function resUI(){
  const o=$('#ao');if(!o)return;if(!S.res){o.innerHTML='';return}
  o.innerHTML=`<video src="${S.res}" controls playsinline></video><div class=row><a href="${S.res}" download="clip.mp4"><button style="width:100%">ดาวน์โหลด</button></a>${S.saveSt=='err'?'<button class=g onclick=upAuto()>บันทึกใหม่</button>':''}</div>${S.saveSt=='ok'?'<button class=main style="margin-top:8px" onclick=goClips()>ไปที่ คลิปของฉัน</button>':''}`;
}
// ---------- สินค้า ----------
function pView(){
  $('#v').innerHTML=`<details class=card ${S.products.length?'':'open'}><summary><b>+ เพิ่มสินค้า</b></summary><div class=card style="margin:6px 0"><b>ให้ AI กรอกให้</b><br><small>เลือกภาพหน้าจอหน้าสินค้า หรือวางข้อความจากหน้าสินค้า</small><input id=pimg type=file accept="image/*"><textarea id=ptx rows=3 placeholder="หรือวางข้อความจากหน้าสินค้าที่นี่"></textarea><button class=g id=pgo onclick=aiP()>ให้ AI สรุป</button> <small id=pm></small></div><input id=n placeholder="ชื่อสินค้า"><input id=l placeholder="ลิงก์ affiliate"><input id=pr type=number placeholder="ราคา (บาท)"><textarea id=nt rows=2 placeholder="จุดเด่น (ใช้ในสคริปต์)"></textarea><button class=main onclick=addP()>บันทึกสินค้า</button></details>`+
  (S.products.length?S.products.map(p=>`<div class=card><div class=rw><b>${esc(p.name)}</b><span class=pill>${p.price!=null?'฿'+Number(p.price).toLocaleString('th-TH'):'ไม่ระบุราคา'}</span></div><div class=ell><small>${esc(p.aff_link)}</small></div><div class=rw><span></span><button class="g sm" onclick="delRow('products','${p.id}')">ลบ</button></div></div>`).join(''):`<p class=empty>ยังไม่มีสินค้า เพิ่มสินค้าแรกเพื่อใส่ชื่อและราคาลงการ์ด CTA ท้ายคลิป</p>`);
}
async function imgB64(f){
  const bmp=await createImageBitmap(f),k=Math.min(1,1280/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');
  c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',.85).split(',')[1];
}
async function aiP(){
  const f=$('#pimg').files[0],t=$('#ptx').value.trim(),m=$('#pm'),b=$('#pgo');
  if(!f&&!t)return alert('เลือกภาพหน้าจอหรือวางข้อความก่อน');
  b.disabled=true;m.textContent='AI กำลังอ่านข้อมูล…';
  try{
    const body={text:t};if(f){body.image=await imgB64(f);body.mime='image/jpeg'}
    const{data,error}=await sb.functions.invoke('product-extract',{body});
    if(error)throw error;if(data&&data.error)throw new Error(data.error);
    if(data.name)$('#n').value=data.name;if(data.price!=null)$('#pr').value=data.price;if(data.notes)$('#nt').value=data.notes;
    m.textContent='เสร็จแล้ว ตรวจและแก้ก่อนกดบันทึก';
  }catch(x){m.textContent='ผิดพลาด: '+errMsg(x)}finally{b.disabled=false}
}
async function addP(){
  if(!$('#n').value)return;
  await sb.from('products').insert({name:$('#n').value,aff_link:$('#l').value,price:$('#pr').value||null,notes:$('#nt').value});load();
}
async function delRow(t,id){if(confirm('ลบ?')){const c=t=='clips'?S.clips.find(x=>x.id==id):null;if(c&&c.out_path)await sb.storage.from('clips').remove([c.out_path]);await sb.from(t).delete().eq('id',id);load();}}
// ---------- คลิป (วางแผน) ----------
function cView(){
  const c=S.cur;
  if(!c){
    $('#v').innerHTML=`<div class=rw><h3>คลิปของฉัน</h3><button onclick="S.cur={shot_list:[],status:'idea'};S.shots=[];cView()">+ คลิปใหม่</button></div>`+(S.clips.length?S.clips.map(x=>`<div class=card onclick="openClip('${x.id}')"><div class=rw><b>${esc(x.title)||'(ไม่มีชื่อ)'}</b><span class="pill ${x.status}">${ST[x.status]||x.status}</span></div>${x.out_path?`<div class=rw><small>มีคลิปที่ตัดแล้ว</small><button class="g sm" onclick="event.stopPropagation();playOut('${x.out_path}','pl_${x.id}')">▶ ดูคลิป</button></div><div id="pl_${x.id}" onclick="event.stopPropagation()"></div>`:''}</div>`).join(''):`<p class=empty>ยังไม่มีคลิป กด "+ คลิปใหม่" เพื่อวางแผน หรือไปแท็บออโต้เพื่อทำคลิปจากวิดีโอ</p>`);return;
  }
  $('#v').innerHTML=`<div class=card><input id=t placeholder=ชื่อคลิป value="${esc(c.title)}">${c.out_path?`<button class=g onclick="playOut('${c.out_path}','plv')">▶ คลิปที่ตัดแล้ว</button><div id=plv></div>`:''}
  <select id=pid><option value="">— เลือกสินค้า —</option>${S.products.map(p=>`<option value=${p.id} ${p.id==c.product_id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
  <select id=st>${STATUS.map(s=>`<option ${s==c.status?'selected':''}>${s}</option>`).join('')}</select>
  <button class=g onclick=tpl()>สร้างสคริปต์ตั้งต้น (Hook→Demo→CTA)</button>
  <textarea id=sc rows=7 placeholder=สคริปต์>${esc(c.script)}</textarea>
  <h3>Shot list</h3><div id=sh></div><button class=g onclick="S.shots.push({t:'',d:''});shots()">+ ช็อต</button>
  <textarea id=cp rows=4 placeholder=แคปชัน>${esc(c.caption)}</textarea>
  <div class=row><button onclick=saveC()>บันทึก</button><button class=g onclick=copyCap()>คัดลอกแคปชัน+ลิงก์</button><button class=g onclick="S.cur=null;cView()">กลับ</button></div>
  ${c.id?`<button class=g onclick="delRow('clips','${c.id}');S.cur=null">ลบคลิป</button>`:''}</div>`;
  shots();
}
function openClip(id){S.cur=S.clips.find(x=>x.id==id);S.shots=[...(S.cur.shot_list||[])];cView();}
function shots(){
  $('#sh').innerHTML=S.shots.map((s,i)=>`<div class=row><input style="max-width:90px" placeholder="0:00-0:03" value="${esc(s.t)}" oninput="S.shots[${i}].t=this.value">
  <input placeholder=ภาพ/การเคลื่อนไหว value="${esc(s.d)}" oninput="S.shots[${i}].d=this.value">
  <button class=g style="flex:0" onclick="S.shots.splice(${i},1);shots()">✕</button></div>`).join('');
}
function prod(){return S.products.find(p=>p.id==$('#pid').value)}
function tpl(){
  const p=prod(),n=p?p.name:'สินค้า';
  $('#sc').value=`[Hook 0-3วิ] เคยเจอปัญหานี้ไหม? …\n[ปัญหา 3-8วิ] …\n[โชว์สินค้า 8-20วิ] ${n} ${p?.notes||'จุดเด่น 1-2-3'}\n[พิสูจน์/รีวิว] …\n[CTA] กดตะกร้าเหลืองด้านล่างได้เลย`;
  S.shots=[{t:'0:00-0:03',d:'Hook: ใบหน้า/ปัญหา close-up'},{t:'0:03-0:08',d:'โชว์ปัญหา'},{t:'0:08-0:20',d:`โชว์ ${n} ใช้งานจริง`},{t:'0:20-0:25',d:'CTA + ตะกร้า'}];shots();
}
async function saveC(){
  const r={title:$('#t').value,product_id:$('#pid').value||null,status:$('#st').value,script:$('#sc').value,caption:$('#cp').value,shot_list:S.shots};
  const q=S.cur.id?sb.from('clips').update(r).eq('id',S.cur.id):sb.from('clips').insert(r);
  const{error}=await q;if(error)return alert(error.message);S.cur=null;load();
}
function copyCap(){const p=prod();navigator.clipboard.writeText($('#cp').value+(p?.aff_link?'\n'+p.aff_link:''));alert('คัดลอกแล้ว')}
// ---------- ตัดต่อ (ffmpeg.wasm ในเบราว์เซอร์) ----------
let ff=null;
function eView(){
  $('#v').innerHTML=`<div class=card><input id=f type=file accept="video/*" onchange="pv(this)"><video id=pvv controls playsinline></video>
  <div class=row><div><small>เริ่ม (วิ)</small><input id=s type=number value=0 step=0.1></div><div><small>จบ (วิ)</small><input id=e type=number value=15 step=0.1></div></div>
  <select id=fmt><option value=v>ครอป 9:16 (720×1280)</option><option value=n>ไม่ครอป</option></select>
  <label><input type=checkbox id=mu style="width:auto"> ปิดเสียง</label><br>
  <div class=card><b>ซับตามคำพูด</b><select id=md><option value=Xenova/whisper-small>แม่นกว่า (small ~250MB)</option><option value=Xenova/whisper-base>เร็วกว่า (base ~80MB)</option></select>
  <div class=row><select id=lg><option value=thai>ภาษาพูด: ไทย</option><option value=english>อังกฤษ</option><option value=chinese>จีน</option><option value=japanese>ญี่ปุ่น</option><option value=korean>เกาหลี</option><option value=vietnamese>เวียดนาม</option><option value=indonesian>อินโดนีเซีย</option></select>
  <select id=tp><option value=def>เทมเพลต: ค่าเริ่มต้น</option><option value=yellow>ตัวเหลือง</option><option value=box>พื้นหลังดำ</option><option value=big>ตัวใหญ่หนา</option></select></div>
  <div class=row><select id=ps><option value=bot>ตำแหน่ง: ล่าง</option><option value=mid>กลาง</option><option value=top>บน</option></select>
  <select id=sz><option value=m>ขนาด: กลาง</option><option value=s>เล็ก</option><option value=l>ใหญ่</option></select></div>

function subPng(t,W,bh,o){
  o=o||{tp:$('#tp').value,sz:$('#sz').value};const tp=o.tp,k={s:.045,m:.06,l:.08}[o.sz]*(tp=='big'?1.2:1),fs=Math.round(W*k);
  const c=document.createElement('canvas');c.width=W;c.height=bh;const g=c.getContext('2d');
  g.font=`bold ${fs}px "Noto Sans Thai","Sarabun",sans-serif`;g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
  const sp=/\s/.test(t),toks=sp?t.split(/(?<=\s)/):[...t],MARK=/[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]/,lines=[];let ln='';
  for(const tk of toks){
    if(!(!sp&&MARK.test(tk))&&ln&&g.measureText(ln+tk).width>W*0.9){lines.push(ln.trimEnd());ln=tk}else ln+=tk;
  }
  lines.push(ln.trimEnd());
  const lh=fs*1.3,y0=bh/2-(lines.length-1)*lh/2;
  lines.forEach((l,i)=>{
    const y=y0+i*lh;
    if(tp=='box'){const w=g.measureText(l).width+fs*.6;g.fillStyle='rgba(0,0,0,.65)';g.fillRect(W/2-w/2,y-lh/2,w,lh);g.fillStyle='#fff';g.fillText(l,W/2,y)}
    else{g.lineWidth=fs/(tp=='big'?4:5);g.strokeStyle='#000';g.strokeText(l,W/2,y);g.fillStyle=tp=='yellow'?'#ffe600':'#fff';g.fillText(l,W/2,y)}
  });
  return new Promise(r=>c.toBlob(b=>b.arrayBuffer().then(a=>r(new Uint8Array(a))),'image/png'));
}

function splitSeg(a,b,t){
  const d=b-a,ch=[...t],sp=/\s/.test(t),n=Math.max(1,Math.ceil(d/4),Math.ceil(ch.length/45));
  if(n==1)return[{a,b,t}];
  const out=[];let pos=0;
  for(let k=1;k<=n&&pos<ch.length;k++){
    let end=k==n?ch.length:Math.round(ch.length*k/n);
    while(end<ch.length&&(MK.test(ch[end])||(sp&&!/\s/.test(ch[end-1]))))end++;
    if(end>pos)out.push({a:a+d*pos/ch.length,b:a+d*end/ch.length,t:ch.slice(pos,end).join('').trim()});
    pos=end;
  }
  return out;
}
function wrapTxt(g,t,mw){
  const sp=/\s/.test(t),L=[];let ln='';
  for(const tk of sp?t.split(/(?<=\s)/):[...t]){
    if(!(!sp&&MK.test(tk))&&ln&&g.measureText(ln+tk).width>mw){L.push(ln.trimEnd());ln=tk}else ln+=tk;
  }
  L.push(ln.trimEnd());return L;
}

  const c=document.createElement('canvas');c.width=720;c.height=1280;const g=c.getContext('2d');
  g.fillStyle='rgba(15,15,20,.85)';g.beginPath();g.roundRect(40,380,640,320,28);g.fill();
  g.textAlign='center';g.textBaseline='middle';
  const put=(t,fs,col,y)=>{g.font=`bold ${fs}px "Noto Sans Thai","Sarabun",sans-serif`;g.fillStyle=col;
    wrapTxt(g,t,600).forEach((l,i,a)=>g.fillText(l,360,y+(i-(a.length-1)/2)*fs*1.3))};
  put(name,52,'#fff',455);
  if(price!=null&&price!=='')put('฿'+Number(price).toLocaleString('th-TH'),60,'#ffe600',560);
  put(txt,40,'#fff',645);
  return new Promise(r=>c.toBlob(b=>b.arrayBuffer().then(a=>r(new Uint8Array(a))),'image/png'));
}
async function autoRun(){
  const files=S.files.slice(),o={...S.opt},m={set textContent(t){setMsg(t)}},
    tl=+o.tl,subsOn=o.as,W=720,H=1280,bh=360,ps=o.ps,
    y=Math.round(ps=='top'?H*.08:ps=='mid'?(H-bh)/2:H-bh-H*.08),prod=S.products.find(p=>p.id==o.apid),vol=+o.vol||1;
  S.autoPid=o.apid;S.autoProd=prod?prod.name:'';S.saving=false;
  S.autoBlob=null;S.pm=null;
  try{
    m.textContent='กำลังโหลด ffmpeg…';await loadFF();await ffClean();await fontsReady();
    const asr=await getAsr(m,o.md),plans=[],skipped=[];
    // A) ถอดเสียงทุกคลิป → ช่วงที่มีคำพูด
    for(let i=0;i<files.length;i++){
      m.textContent=`ถอดเสียงคลิป ${i+1}/${files.length}…`;
      let au;try{au=await audio16k(files[i])}catch(e){plans.push({file:files[i],segs:[]});skipped.push(i+1);continue}
      const dur=au.length/16000;
      const r=await asr(au,{language:o.lg,task:'transcribe',return_timestamps:true,chunk_length_s:30,stride_length_s:5}),segs=[];
      for(const c of r.chunks||[]){
        const t=c.text.trim();if(!t)continue;
        const a=Math.max(0,c.timestamp[0]-0.1),b=Math.min(dur,(c.timestamp[1]??dur)+0.2);
        if(b-a>=0.5)segs.push(...splitSeg(a,b,t));
      }
      plans.push({file:files[i],segs});
    }
    // B) ตัดท้ายให้พอดีความยาวเป้าหมาย
    const sum=()=>plans.reduce((s,p)=>s+p.segs.reduce((x,g)=>x+g.b-g.a,0),0);
    while(sum()>tl){const p=[...plans].reverse().find(p=>p.segs.length);if(!p)break;p.segs.pop();}
    const all=plans.filter(p=>p.segs.length);
    if(!all.length)return m.textContent='ไม่พบคำพูดในคลิป';
    const lastSeg=all[all.length-1].segs.slice(-1)[0];
    S.autoScript=all.map(p=>p.segs.map(s=>s.t).join(' ')).join('\n');
    // C) ตัดแต่ละช่วง + ใส่ซับ/CTA (เข้ารหัสแบบเดียวกันเพื่อให้ต่อกันได้)
    const segFiles=[];let n=0;
    for(const[pi,p]of all.entries()){
      await ff.writeFile('in.mp4',await FFmpegUtil.fetchFile(p.file));
      for(const s of p.segs){
        m.textContent=`ตัดต่อคลิป ${pi+1}/${all.length} · ช่วงที่ ${n+1}`;
        const out=`seg${n++}.mp4`,d=s.b-s.a,args=['-ss',s.a.toFixed(2),'-i','in.mp4'];
        let f="[0:v]crop='min(iw,ih*9/16)':'min(ih,iw*16/9)',scale=720:1280,fps=30,setsar=1,format=yuv420p[v0]",last='v0',k=1;
        if(subsOn){await ff.writeFile('sub.png',await subPng(s.t,W,bh,o));args.push('-i','sub.png');f+=`;[${last}][${k}:v]overlay=0:${y}[v${k}]`;last='v'+k;k++}
        if(s===lastSeg&&prod){
          await ff.writeFile('cta.png',await ctaPng(prod.name,prod.price,o.act));args.push('-i','cta.png');
          f+=`;[${last}][${k}:v]overlay=0:0:enable='gte(t,${Math.max(0,d-3).toFixed(2)})'[v${k}]`;last='v'+k;k++;
        }
        args.push('-t',d.toFixed(2),'-filter_complex',f,'-map',`[${last}]`,'-map','0:a?',...(vol==1?[]:['-af',vol>1?`volume=${vol},alimiter=limit=0.97`:`volume=${vol}`]),'-c:v','libx264','-preset','ultrafast','-crf','28','-c:a','aac','-ar','44100','-ac','2','-r','30',out);
        await run(args);segFiles.push(out);
      }
      await ff.deleteFile('in.mp4');
    }
    // D) ต่อทุกช่วง
    m.textContent='กำลังต่อคลิป…';
    await ff.writeFile('list.txt',segFiles.map(f=>`file '${f}'`).join('\n'));
    await run(['-f','concat','-safe','0','-i','list.txt','-c','copy','final.mp4']);
    const d=await ff.readFile('final.mp4');
    for(const f of segFiles)await ff.deleteFile(f);
    S.autoBlob=new Blob([d.buffer],{type:'video/mp4'});const u=URL.createObjectURL(S.autoBlob);
    S.skipNote=skipped.length?` · ข้ามคลิป ${skipped.join(',')} (ไม่มีเสียง)`:'';S.res=u;S.saveSt='';resUI();
    m.textContent=`ตัดต่อเสร็จ (${segFiles.length} ช่วง, ~${Math.round(sum())} วิ)`;
    await upAuto();
  }catch(x){m.textContent='ผิดพลาด: '+errMsg(x)}
}
async function upAuto(){
  if(!S.autoBlob||S.saving)return;S.saving=true;S.saveSt='';resUI();
  setMsg('กำลังบันทึกเข้า คลิปของฉัน…');
  try{
    const{data:{user}}=await sb.auth.getUser(),path=`${user.id}/${Date.now()}.mp4`;
    const u=await sb.storage.from('clips').upload(path,S.autoBlob,{contentType:'video/mp4'});
    if(u.error)throw u.error;
    const r=await sb.from('clips').insert({title:'ออโต้ '+(S.autoProd?S.autoProd+' ':'')+new Date().toLocaleDateString('th-TH'),product_id:S.autoPid||null,status:'editing',out_path:path,script:S.autoScript});
    if(r.error)throw r.error;
    const c=await sb.from('clips').select('*').order('created_at',{ascending:false});S.clips=c.data||S.clips;
    S.autoBlob=null;S.saveSt='ok';resUI();setMsg('บันทึกเข้า คลิปของฉัน เรียบร้อย'+(S.skipNote||''));
    if(S.tab=='clips'&&!S.cur)cView();
  }catch(x){S.saving=false;S.saveSt='err';resUI();setMsg('บันทึกไม่สำเร็จ: '+errMsg(x))}
}
init();
</script></body></html>
