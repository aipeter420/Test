<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2f4f6">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@600;700&display=swap" rel="stylesheet">
<title>Clip Assistant</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<style>
:root{--bg:#f2f4f6;--sf:#fff;--ink:#14181d;--mut:#667180;--bd:#e0e4e9;--ac:#ffd23f;--pri:#0f766e;--r:16px}
@media(prefers-color-scheme:dark){:root{--bg:#0f1216;--sf:#181c22;--ink:#eef1f4;--mut:#97a1ad;--bd:#2a313a;--pri:#2dd4bf}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans Thai",system-ui,sans-serif}
#app{max-width:560px;margin:auto;min-height:100vh;padding:0 14px 170px}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 2px 8px}
header b{font:700 20px Prompt,sans-serif}
h3{font:600 17px Prompt,sans-serif;margin:.2em 0 .5em}
small{color:var(--mut);font-size:13px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin:10px 0}
input,textarea,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;width:100%;margin:4px 0}
input[type=checkbox]{width:auto;accent-color:var(--pri)}
button{font:600 15px "Noto Sans Thai",sans-serif;background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:11px 16px;cursor:pointer}
button:disabled{opacity:.4}
button.g{background:transparent;color:var(--ink);border:1px solid var(--bd)}
button.main{background:var(--ac);color:#14181d;width:100%;padding:15px;font-size:17px;border-radius:14px}
button.main:disabled{opacity:.55}
.sm{padding:6px 12px;font-size:14px}
.row{display:flex;gap:8px}.row>*{flex:1}
.rw{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:2px 10px;font-size:13px;white-space:nowrap}
.pill.shooting{background:#fde68a;color:#14181d;border:0}.pill.editing{background:#bfdbfe;color:#14181d;border:0}.pill.posted{background:#bbf7d0;color:#14181d;border:0}
.empty{color:var(--mut);text-align:center;padding:26px 8px}
video{width:100%;border-radius:12px;background:#000;margin-top:8px}
summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
details[open]>summary{margin-bottom:8px}
.drop{display:grid;gap:4px;place-items:center;text-align:center;border:2px dashed var(--bd);border-radius:var(--r);padding:26px 12px;background:var(--sf);cursor:pointer}
.drop b{font:600 18px Prompt,sans-serif}
.f{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}.f:first-child{border-top:0}
.fn{flex:1;min-width:0}
.n{width:26px;height:26px;border-radius:50%;background:var(--ac);color:#14181d;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.chips,.scroll{display:flex;gap:8px;flex-wrap:wrap}.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.chip{background:var(--sf);color:var(--ink);border:1.5px solid var(--bd);border-radius:999px;padding:8px 16px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sty{flex:none;width:116px;display:grid;gap:3px;place-items:center;align-content:center;height:78px;border:2px solid transparent;border-radius:12px;background:linear-gradient(135deg,#59606b,#1f2937);color:#fff;padding:4px;position:relative}
.sty .tg{position:absolute;top:3px;right:4px;font-size:10px;background:var(--ac);color:#14181d;border-radius:6px;padding:0 5px;font-weight:700}
.sty.on{border-color:var(--ac)}.sty em{font-style:normal;font-size:12px;font-weight:500;opacity:.85}
.s-def{font-weight:700;text-shadow:0 0 3px #000,0 0 3px #000}
.s-yellow{color:#ffe600;font-weight:700;text-shadow:0 0 3px #000,0 0 3px #000}
.s-box{background:rgba(0,0,0,.7);padding:1px 8px;font-weight:700}
.s-big{font-size:21px;font-weight:800;text-shadow:0 0 4px #000,0 0 4px #000}
.hlp{font-weight:700;font-size:15px;text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap}
.hlp i{font-style:normal;border-radius:5px;padding:0 2px;transition:color .15s}
.hlp i.on{color:#ffe600}
.hlp[data-m=hlb] i.on{background:#ffd23f;color:#14181d;text-shadow:none}
button.g.dg{color:#dc2626;border-color:#dc262666}
.sw{font-size:14px;color:var(--mut)}
.st{padding:10px 4px;color:var(--mut);font-size:14px}
.st.busy::before{content:"";display:inline-block;width:12px;height:12px;border:2px solid var(--bd);border-top-color:var(--ink);border-radius:50%;margin-right:8px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.st.busy::before{animation:none}}
.dock{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));padding:24px 14px 8px;background:linear-gradient(transparent,var(--bg) 45%);max-width:560px;margin:auto}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px);z-index:5}
.tabs button{flex:1;background:none;color:var(--mut);display:grid;justify-items:center;gap:2px;font-size:12px;padding:4px 0}
.tabs button.on{color:var(--ink)}
.tabs i{display:grid;place-items:center;width:54px;height:30px;border-radius:15px}
.tabs button.on i{background:var(--ac);color:#14181d}
.bn{background:var(--ac);color:#14181d;border-radius:12px;padding:10px 14px;margin:6px 0;font-size:14px;font-weight:600;cursor:pointer}.bn[hidden]{display:none}
.login{padding-top:16vh}.login h1{font:700 30px Prompt,sans-serif;margin:0 0 6px}.login p{color:var(--mut);margin:0 0 16px}
</style></head><body>
<div id="app"></div>
<script>
// ====== ใส่ค่าของโปรเจกต์ Supabase ======
let _c={};try{_c=JSON.parse(localStorage.getItem('cfg')||'{}')}catch(e){}
const SUPABASE_URL=_c.u||'https://YOUR-PROJECT.supabase.co', SUPABASE_KEY=_c.k||'YOUR-ANON-KEY';
// ========================================
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY), $=s=>document.querySelector(s);
const S={tab:'auto',products:[],clips:[],cur:null,shots:[]};
window.addEventListener('unhandledrejection',e=>{if(S.busy)setMsg('ผิดพลาด: '+errMsg(e.reason))});
S.opt={mm:true,hs:'0',dr:true,vis:false,dg:'sell',tl:'60',vol:'1',tp:'def',ps:'bot',sz:'m',apid:'',as:true,act:'กดตะกร้าเหลืองด้านล่างได้เลย',lg:'thai',md:'Xenova/whisper-base'};
window.addEventListener('beforeunload',e=>{if(S.busy){e.preventDefault();e.returnValue=''}});
const STATUS=['idea','shooting','editing','posted'];
const esc=t=>(t??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function setupUI(){
  $('#app').innerHTML=`<div class=login><h1>ตั้งค่าครั้งแรก</h1><p>ใส่ค่าจาก Supabase → Project Settings → API (Project URL และ anon public key) ระบบจะจำไว้ในเครื่องนี้</p>
  <input id=cu placeholder="https://xxxx.supabase.co"><input id=ck placeholder="anon public key"><button class=main onclick="localStorage.setItem('cfg',JSON.stringify({u:$('#cu').value.trim(),k:$('#ck').value.trim()}));location.reload()">บันทึก</button></div>`;
}
async function init(){
  if(/YOUR-PROJECT|YOUR-ANON-KEY/.test(SUPABASE_URL+SUPABASE_KEY))return setupUI();
  const{data:{session}}=await sb.auth.getSession();
  session?load():loginUI();
}
function loginUI(){
  $('#app').innerHTML=`<div class=login><h1>Clip Assistant</h1><p>โยนคลิปดิบเข้ามา ได้คลิปขายของพร้อมซับกลับไป</p>
  <input id=e type=email placeholder="อีเมล" autocomplete=email><input id=p type=password placeholder="รหัสผ่าน (6 ตัวขึ้นไป)" autocomplete=current-password>
  <button class=main onclick="auth('in')">เข้าสู่ระบบ</button><button class=g style="width:100%;margin-top:8px" onclick="auth('up')">สมัครบัญชีใหม่</button>
  <p style="margin-top:18px"><small>เชื่อมต่อกับ: ${esc((()=>{try{return new URL(SUPABASE_URL).host}catch(e){return SUPABASE_URL}})())}</small></p><button class="g sm" onclick="setupUI()">แก้ค่าเชื่อมต่อ Supabase</button></div>`;
}
async function auth(m){
  const c={email:$('#e').value,password:$('#p').value};
  try{
    const{error}=m=='in'?await sb.auth.signInWithPassword(c):await sb.auth.signUp(c);
    if(!error)return load();
    alert(/load failed|failed to fetch|network|fetch/i.test(error.message)?'เชื่อมต่อ Supabase ไม่ได้\nตรวจว่า Project URL/คีย์ถูกต้อง และโปรเจกต์ไม่ถูกพัก (กด "แก้ค่าเชื่อมต่อ Supabase")':error.message);
  }catch(x){alert('เชื่อมต่อ Supabase ไม่ได้ ('+errMsg(x)+')')}
}
async function load(){
  const[a,b]=await Promise.all([sb.from('products').select('*').order('created_at',{ascending:false}),
    sb.from('clips').select('*').order('created_at',{ascending:false})]);
  S.products=a.data||[];S.clips=b.data||[];render();
}
const TABS=[['auto','ออโต้','<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>'],['clips','คลิปของฉัน','<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M16 4v16M3 12h18"/>'],['products','สินค้า','<path d="M3 12V3h9l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/>'],['edit','ตัดต่อเอง','<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.5 8 20 19M8.5 16 20 5"/>']];
const ST={idea:'ไอเดีย',shooting:'กำลังถ่าย',editing:'ตัดต่อ',posted:'โพสต์แล้ว'};
function render(){
  $('#app').innerHTML=`<header><b>Clip Assistant</b><button class="g sm" onclick="sb.auth.signOut().then(loginUI)">ออกจากระบบ</button></header><div id=bn class=bn hidden onclick="bnGo()"></div><main id=v></main>
  <nav class=tabs>${TABS.map(([k,l,d])=>`<button class="${S.tab==k?'on':''}" onclick="S.tab='${k}';render()"><i><svg viewBox="0 0 24 24" width=22 height=22 fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round>${d}</svg></i>${l}</button>`).join('')}</nav>`;
  ({products:pView,clips:cView,auto:aView,edit:eView})[S.tab]();banner();
}
function goClips(){S.tab='clips';S.cur=null;render()}
function bnGo(){S.note=false;S.busy?(S.tab='auto',render()):goClips()}
function banner(){
  if(S.tab=='auto'||(S.tab=='clips'&&!S.busy))S.note=false;
  const b=$('#bn');if(!b)return;const show=S.busy||S.note;b.hidden=!show;
  if(show)b.textContent=(S.busy?'⏳ กำลังทำคลิป · ':'✓ ')+(S.msg||'')+(S.busy?' (แตะเพื่อดู)':' (แตะเพื่อไปที่คลิปของฉัน)');
}
function setMsg(t){S.msg=t;const a=$('#am');if(a){a.textContent=t;a.classList.toggle('busy',!!S.busy)}banner()}
function resUI(){
  const o=$('#ao');if(!o)return;if(!S.res){o.innerHTML='';return}
  o.innerHTML=`<video src="${S.res}" controls playsinline></video><div class=row><a href="${S.res}" download="clip.mp4"><button style="width:100%">ดาวน์โหลด</button></a>${S.saveSt=='err'?'<button class=g onclick=upAuto()>บันทึกใหม่</button>':''}</div>${S.saveSt=='ok'?'<button class=main style="margin-top:8px" onclick=goClips()>ไปที่ คลิปของฉัน</button>':''}${planUI()}`;
}
const ROLE={hook:'Hook',problem:'ปัญหา',demo:'โชว์สินค้า',proof:'พิสูจน์',price:'ราคา/โปร',cta:'ชวนซื้อ'};
function planUI(){
  if(!S.plan)return '';
  return `<details class=card open><summary><b>AI เลือกอะไรบ้าง</b> <small>(${S.plan.length} ช่วง)</small></summary>${S.plan.map((x,i)=>`<div class=f><span class=n>${i+1}</span><div class=fn><div><span class=pill>${ROLE[x.role]||x.role}</span> <small>คลิป ${x.clip}</small></div><div>${esc(x.t)}</div><small>${esc(x.why)}</small></div></div>`).join('')}${S.autoCap?`<div class=card style="margin:8px 0 0"><b>แคปชัน</b><div style="white-space:pre-wrap">${esc(S.autoCap)}</div><button class="g sm" onclick="navigator.clipboard.writeText(S.autoCap);alert('คัดลอกแล้ว')">คัดลอกแคปชัน</button></div>`:''}</details>`;
}
// ---------- สินค้า ----------
function pView(){
  $('#v').innerHTML=`<details class=card ${S.products.length?'':'open'}><summary><b>+ เพิ่มสินค้า</b></summary><div class=card style="margin:6px 0"><b>ให้ AI กรอกให้</b><br><small>เลือกภาพหน้าจอหน้าสินค้า หรือวางข้อความจากหน้าสินค้า</small><input id=pimg type=file accept="image/*"><textarea id=ptx rows=3 placeholder="หรือวางข้อความจากหน้าสินค้าที่นี่"></textarea><button class=g id=pgo onclick=aiP()>ให้ AI สรุป</button> <small id=pm></small></div><input id=n placeholder="ชื่อสินค้า"><input id=l placeholder="ลิงก์ affiliate"><input id=pr type=number placeholder="ราคา (บาท)"><textarea id=nt rows=2 placeholder="จุดเด่น (ใช้ในสคริปต์)"></textarea><button class=main onclick=addP()>บันทึกสินค้า</button></details>`+
  (S.products.length?S.products.map(p=>`<div class=card><div class=rw><b>${esc(p.name)}</b><span class=pill>${p.price!=null?'฿'+Number(p.price).toLocaleString('th-TH'):'ไม่ระบุราคา'}</span></div><div class=ell><small>${esc(p.aff_link)}</small></div><div class=rw><span></span><button class="g sm" onclick="delRow('products','${p.id}')">ลบ</button></div></div>`).join(''):`<p class=empty>ยังไม่มีสินค้า เพิ่มสินค้าแรกเพื่อใส่ชื่อและราคาลงการ์ด CTA ท้ายคลิป</p>`);
}
async function imgB64(f){
  const bmp=await createImageBitmap(f),k=Math.min(1,1280/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');
  c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',.85).split(',')[1];
}
async function aiP(){
  const f=$('#pimg').files[0],t=$('#ptx').value.trim(),m=$('#pm'),b=$('#pgo');
  if(!f&&!t)return alert('เลือกภาพหน้าจอหรือวางข้อความก่อน');
  b.disabled=true;m.textContent='AI กำลังอ่านข้อมูล…';
  try{
    const body={text:t};if(f){body.image=await imgB64(f);body.mime='image/jpeg'}
    const{data,error}=await sb.functions.invoke('product-extract',{body});
    if(error)throw error;if(data&&data.error)throw new Error(data.error);
    if(data.name)$('#n').value=data.name;if(data.price!=null)$('#pr').value=data.price;if(data.notes)$('#nt').value=data.notes;
    m.textContent='เสร็จแล้ว ตรวจและแก้ก่อนกดบันทึก';
  }catch(x){m.textContent='ผิดพลาด: '+errMsg(x)}finally{b.disabled=false}
}
async function addP(){
  if(!$('#n').value)return;
  await sb.from('products').insert({name:$('#n').value,aff_link:$('#l').value,price:$('#pr').value||null,notes:$('#nt').value});load();
}
async function delRow(t,id){
  if(!confirm(t=='clips'?'ลบคลิปนี้? (รวมไฟล์วิดีโอที่ตัดแล้ว) ย้อนกลับไม่ได้':'ลบรายการนี้?'))return;
  const c=t=='clips'?S.clips.find(x=>x.id==id):null;
  if(c&&c.out_path){const r=await sb.storage.from('clips').remove([c.out_path]);if(r.error)return alert('ลบไฟล์วิดีโอไม่สำเร็จ: '+r.error.message)}
  const r=await sb.from(t).delete().eq('id',id);if(r.error)return alert('ลบไม่สำเร็จ: '+r.error.message);
  S.cur=null;load();
}
// ---------- คลิป (วางแผน) ----------
function cView(){
  const c=S.cur;
  if(!c){
    $('#v').innerHTML=`<div class=rw><h3>คลิปของฉัน</h3><button onclick="S.cur={shot_list:[],status:'idea'};S.shots=[];cView()">+ คลิปใหม่</button></div>`+(S.clips.length?S.clips.map(x=>`<div class=card onclick="openClip('${x.id}')"><div class=rw><b class=ell>${esc(x.title)||'(ไม่มีชื่อ)'}</b><span class="pill ${x.status}">${ST[x.status]||x.status}</span></div><div class=rw><small>${x.out_path?'มีคลิปที่ตัดแล้ว':'ยังไม่มีไฟล์วิดีโอ'}</small><span style="display:flex;gap:6px">${x.out_path?`<button class="g sm" onclick="event.stopPropagation();playOut('${x.out_path}','pl_${x.id}')">▶ ดูคลิป</button>`:''}<button class="g dg sm" onclick="event.stopPropagation();delRow('clips','${x.id}')">🗑 ลบ</button></span></div>${x.out_path?`<div id="pl_${x.id}" onclick="event.stopPropagation()"></div>`:''}</div>`).join(''):`<p class=empty>ยังไม่มีคลิป กด "+ คลิปใหม่" เพื่อวางแผน หรือไปแท็บออโต้เพื่อทำคลิปจากวิดีโอ</p>`);return;
  }
  $('#v').innerHTML=`<div class=card><input id=t placeholder=ชื่อคลิป value="${esc(c.title)}">${c.out_path?`<button class=g onclick="playOut('${c.out_path}','plv')">▶ คลิปที่ตัดแล้ว</button><div id=plv></div>`:''}
  <select id=pid><option value="">— เลือกสินค้า —</option>${S.products.map(p=>`<option value=${p.id} ${p.id==c.product_id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
  <select id=st>${STATUS.map(s=>`<option ${s==c.status?'selected':''}>${s}</option>`).join('')}</select>
  <button class=g onclick=tpl()>สร้างสคริปต์ตั้งต้น (Hook→Demo→CTA)</button>
  <textarea id=sc rows=7 placeholder=สคริปต์>${esc(c.script)}</textarea>
  <h3>Shot list</h3><div id=sh></div><button class=g onclick="S.shots.push({t:'',d:''});shots()">+ ช็อต</button>
  <textarea id=cp rows=4 placeholder=แคปชัน>${esc(c.caption)}</textarea>
  <div class=row><button onclick=saveC()>บันทึก</button><button class=g onclick=copyCap()>คัดลอกแคปชัน+ลิงก์</button><button class=g onclick="S.cur=null;cView()">กลับ</button></div>
  ${c.id?`<button class="g dg" style="width:100%;margin-top:8px" onclick="delRow('clips','${c.id}')">🗑 ลบคลิปนี้</button>`:''}</div>`;
  shots();
}
function openClip(id){S.cur=S.clips.find(x=>x.id==id);S.shots=[...(S.cur.shot_list||[])];cView();}
function shots(){
  $('#sh').innerHTML=S.shots.map((s,i)=>`<div class=row><input style="max-width:90px" placeholder="0:00-0:03" value="${esc(s.t)}" oninput="S.shots[${i}].t=this.value">
  <input placeholder=ภาพ/การเคลื่อนไหว value="${esc(s.d)}" oninput="S.shots[${i}].d=this.value">
  <button class=g style="flex:0" onclick="S.shots.splice(${i},1);shots()">✕</button></div>`).join('');
}
function prod(){return S.products.find(p=>p.id==$('#pid').value)}
function tpl(){
  const p=prod(),n=p?p.name:'สินค้า';

async function audio16k(file){

    if(S.opt.mm===false)throw e;
    const keep=S.opt.mm;S.opt.mm=false;

async function audio16kOnce(file){
  const inp=await inOpen(file);
  try{
    await run(['-i',inp,'-vn','-ac','1','-ar','16000','-f','f32le','a_out.raw']);
    const mm=S.log.join('\n').match(/Stream #0:(\d+)(?:\([^)]*\))? -> #0:0/);S.aIdx=mm?mm[1]:null;
    const d=await ff.readFile('a_out.raw');await ff.deleteFile('a_out.raw');

  }finally{await inClose()}
}

// ---------- ซับไฮไลต์ตามคำพูด ----------
const HL=new Set(['hl','kar','hlb']); // hl=คำที่กำลังพูดเป็นสีเหลือง, kar=คำที่พูดแล้วเหลืองสะสม, hlb=กล่องเหลืองหลังคำ
const en=(a,b)=>`gte(t,${a.toFixed(2)})*lt(t,${b.toFixed(2)})`;
// ตัดข้อความเป็นคำ (ต่อกันแล้วต้องได้ข้อความเดิมเป๊ะ) ไทย/จีน/ญี่ปุ่นใช้ Intl.Segmenter ภาษาที่เว้นวรรคใช้ช่องว่าง
function wordsOf(t,lg){
  const loc={thai:'th',chinese:'zh',japanese:'ja'}[lg];
  if(!loc)return t.match(/\S+\s*/g)||[];
  const toks=[];
  if(typeof Intl!='undefined'&&Intl.Segmenter){
    for(const s of new Intl.Segmenter(loc,{granularity:'word'}).segment(t)){
      if(!s.isWordLike&&toks.length)toks[toks.length-1]+=s.segment;else toks.push(s.segment);
    }
  }else{ // เบราว์เซอร์เก่า: แยกทีละตัวอักษร (สระนำไปรวมกับพยัญชนะตัวถัดไป วรรณยุกต์/ช่องว่างรวมกับตัวก่อนหน้า)
    let pend='';
    for(const c of t){
      if(toks.length&&(MK.test(c)||/\s/.test(c)))toks[toks.length-1]+=c;
      else if(/[เแโใไ]/.test(c))pend+=c;
      else{toks.push(pend+c);pend=''}
    }
    if(pend)toks.push(pend);
  }
  return toks;
}
// ข้อความ+ช่วงเวลา → คำละช่วง (กระจายตามจำนวนตัวอักษร) ใช้เมื่อไม่มีเวลาระดับคำจาก Whisper
function evenWords(x,lg){
  const toks=wordsOf(x.t,lg),d=x.b-x.a,n=Math.max(1,toks.reduce((s,k)=>s+k.length,0));let pos=0;
  return toks.map(k=>{const a=x.a+d*pos/n;pos+=k.length;return{t:k,a,b:x.a+d*pos/n}});
}
// ชิ้นส่วนที่ Whisper ให้มา (ไทยมักเป็นชิ้นเล็กระดับพยางค์/ตัวอักษร) → คำจริง พร้อมเวลาเริ่ม-จบของแต่ละคำ
function regroup(pcs,lg){
  let out;
  if(!{thai:1,chinese:1,japanese:1}[lg])out=pcs.map(p=>({t:p.t.trim()+' ',a:p.a,b:p.b}));
  else{
    const full=pcs.map(p=>p.t).join(''),ua=[],ub=[];
    for(const p of pcs){const n=p.t.length;for(let i=0;i<n;i++){ua.push(p.a+(p.b-p.a)*i/n);ub.push(p.a+(p.b-p.a)*(i+1)/n)}}
    out=[];let pos=0;
    for(const k of wordsOf(full,lg)){out.push({t:k,a:ua[pos],b:ub[Math.min(pos+k.length,ub.length)-1]});pos+=k.length}
  }
  let prev=0;for(const x of out){x.a=Math.max(x.a,prev);if(x.b<x.a+.05)x.b=x.a+.05;prev=x.b}
  return out;
}
// รวมคำเป็นบรรทัดซับ: เว้นเงียบ >0.8 วิ, ยาว >45 ตัวอักษร หรือ >4 วิ แล้วขึ้นบรรทัดใหม่
function groupWords(ws,dur){
  const g=[];let cur=null,len=0;
  for(const w of ws){
    if(!cur||w.a-cur.b>0.8||len+w.t.length>45||w.b-cur.w[0].a>4){cur={w:[],b:0};g.push(cur);len=0}
    cur.w.push(w);cur.b=w.b;len+=w.t.length;
  }
  return g.map(s=>({w:s.w,t:s.w.map(x=>x.t).join('').trim(),a:Math.max(0,s.w[0].a-.1),b:Math.min(dur,s.b+.2)})).filter(s=>s.t&&s.b-s.a>=0.5);
}
// ถอดเสียงระดับคำ ถ้าโมเดลไม่รองรับ/ผิดพลาดคืน null (ผู้เรียกจะถอยไปใช้แบบประโยค + กระจายเวลาตามตัวอักษร)
async function wordSegs(asr,au,lg,dur){
  try{
    const r=await asr(au,{language:lg,task:'transcribe',return_timestamps:'word',chunk_length_s:30,stride_length_s:5});
    const pcs=(r.chunks||[]).filter(c=>c.text.trim()&&c.timestamp&&c.timestamp[0]!=null).map(c=>({t:c.text,a:c.timestamp[0],b:c.timestamp[1]??c.timestamp[0]+.3}));
    const g=groupWords(regroup(pcs,lg),dur);
    if(!g.length)throw new Error('โหมดคำไม่ได้ผลลัพธ์');
    return g;
  }catch(x){console.warn('word timestamps ใช้ไม่ได้ ถอยไปแบบประโยค',x);return null}
}
// ซับ 1 บรรทัด → รายการภาพ [{png,a,b}] (สไตล์ปกติ 1 ภาพ, สไตล์ไฮไลต์ 1 ภาพต่อคำ) เวลาลบ off ให้เป็นเวลาในคลิปที่ตัด
async function subFrames(x,W,bh,o,off){
  off=off||0;
  if(!HL.has(o.tp))return[{png:await subPng(x.t,W,bh,o),a:x.a-off,b:x.b-off}];
  const w=x.w&&x.w.length?x.w:evenWords(x,o.lg),out=[],hs=+o.hs||0,last=w.length-1;
  let a=x.a;
  for(let i=0;i<=last;i++){
    // hs เลื่อนจุดเปลี่ยนสีของทุกคำ (ติดลบ = สีมาเร็วขึ้น) ภายในช่วงของซับบรรทัดนั้น
    const b=i<last?Math.min(Math.max(w[i+1].a+hs,a+.05),Math.max(x.b-.05,a+.05)):Math.max(x.b,a+.05);
    out.push({png:await subPng(x.t,W,bh,o,w,i),a:a-off,b:b-off});a=b;
  }
  return out;
}
function hlPng(W,bh,tp,fs,w,hi){
  const c=document.createElement('canvas');c.width=W;c.height=bh;const g=c.getContext('2d');
  g.font=`bold ${fs}px "Noto Sans Thai","Sarabun",sans-serif`;g.textAlign='left';g.textBaseline='middle';g.lineJoin='round';
  const L=[];let cur=[],tx='';
  w.forEach((x,i)=>{const n=tx+x.t;if(cur.length&&g.measureText(n.trim()).width>W*0.9){L.push(cur);cur=[i];tx=x.t}else{cur.push(i);tx=n}});
  if(cur.length)L.push(cur);
  const lh=fs*1.3,y0=bh/2-(L.length-1)*lh/2,items=[];
  L.forEach((ix,li)=>{
    const y=y0+li*lh,left=W/2-g.measureText(ix.map(i=>w[i].t).join('').trim()).width/2;let pre='';
    ix.forEach((i,n)=>{
      const raw=n?w[i].t:w[i].t.replace(/^\s+/,''),lead=raw.match(/^\s*/)[0],core=raw.trim();
      items.push({i,core,y,x:left+g.measureText(pre+lead).width,cw:g.measureText(core).width});pre+=raw;
    });
  });
  const box=tp=='hlb',on=it=>tp=='kar'?it.i<=hi:it.i==hi;
  for(const it of items)if(box&&on(it)){g.fillStyle='#ffd23f';g.beginPath();g.roundRect(it.x-fs*.18,it.y-lh*.64,it.cw+fs*.36,lh*1.04,fs*.22);g.fill()}
  g.lineWidth=fs/5;g.strokeStyle='#000';
  for(const it of items)if(!(box&&on(it)))g.strokeText(it.core,it.x,it.y);
  for(const it of items){g.fillStyle=box?(on(it)?'#14181d':'#fff'):(on(it)?'#ffe600':'#fff');g.fillText(it.core,it.x,it.y)}
  return new Promise(r=>c.toBlob(b=>b.arrayBuffer().then(a=>r(new Uint8Array(a))),'image/png'));
}
// วาดซับเป็น PNG ด้วย canvas (ให้เบราว์เซอร์จัดวรรณยุกต์ไทยเอง) แล้วให้ ffmpeg overlay
function subPng(t,W,bh,o,w,hi){
  o=o||{tp:$('#tp').value,sz:$('#sz').value};const tp=o.tp,k={s:.045,m:.06,l:.08}[o.sz]*(tp=='big'?1.2:1),fs=Math.round(W*k);
  if(w&&HL.has(tp))return hlPng(W,bh,tp,fs,w,hi);
  const c=document.createElement('canvas');c.width=W;c.height=bh;const g=c.getContext('2d');
  g.font=`bold ${fs}px "Noto Sans Thai","Sarabun",sans-serif`;g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
  const sp=/\s/.test(t),toks=sp?t.split(/(?<=\s)/):[...t],MARK=/[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]/,lines=[];let ln='';
  for(const tk of toks){
    if(!(!sp&&MARK.test(tk))&&ln&&g.measureText(ln+tk).width>W*0.9){lines.push(ln.trimEnd());ln=tk}else ln+=tk;
  }
  lines.push(ln.trimEnd());
  const lh=fs*1.3,y0=bh/2-(lines.length-1)*lh/2;
  lines.forEach((l,i)=>{
    const y=y0+i*lh;
    if(tp=='box'){const w=g.measureText(l).width+fs*.6;g.fillStyle='rgba(0,0,0,.65)';g.fillRect(W/2-w/2,y-lh/2,w,lh);g.fillStyle='#fff';g.fillText(l,W/2,y)}
    else{g.lineWidth=fs/(tp=='big'?4:5);g.strokeStyle='#000';g.strokeText(l,W/2,y);g.fillStyle=tp=='yellow'?'#ffe600':'#fff';g.fillText(l,W/2,y)}
  });
  return new Promise(r=>c.toBlob(b=>b.arrayBuffer().then(a=>r(new Uint8Array(a))),'image/png'));
}

const MK=/[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]/;
async function playOut(p,id){

  el.innerHTML=`<video src="${data.signedUrl}" controls playsinline></video><a href="${data.signedUrl}" download><small>ดาวน์โหลด</small></a>`;
}

async function loadFF(){

  const W=await toBlobURL('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/814.ffmpeg.js','text/javascript');

    const f=new FFmpeg();

      f.on('progress',({progress})=>{if(S.pm)S.pm.textContent='กำลังตัดต่อ '+Math.round(progress*100)+'%'});

// แบ่งช่วงที่ยาวเป็นท่อนสั้น ๆ (ซับไม่ล้นจอ) แบ่งเวลาตามสัดส่วนตัวอักษร
function splitSeg(a,b,t){
  const d=b-a,ch=[...t],sp=/\s/.test(t),n=Math.max(1,Math.ceil(d/4),Math.ceil(ch.length/45));
  if(n==1)return[{a,b,t}];
  const out=[];let pos=0;
  for(let k=1;k<=n&&pos<ch.length;k++){
    let end=k==n?ch.length:Math.round(ch.length*k/n);
    while(end<ch.length&&(MK.test(ch[end])||(sp&&!/\s/.test(ch[end-1]))))end++;
    if(end>pos)out.push({a:a+d*pos/ch.length,b:a+d*end/ch.length,t:ch.slice(pos,end).join('').trim()});
    pos=end;
  }
  return out;
}
function wrapTxt(g,t,mw){
  const sp=/\s/.test(t),L=[];let ln='';
  for(const tk of sp?t.split(/(?<=\s)/):[...t]){
    if(!(!sp&&MK.test(tk))&&ln&&g.measureText(ln+tk).width>mw){L.push(ln.trimEnd());ln=tk}else ln+=tk;
  }
  L.push(ln.trimEnd());return L;
}
function ctaPng(name,price,txt){
  const c=document.createElement('canvas');c.width=720;c.height=1280;const g=c.getContext('2d');
  g.fillStyle='rgba(15,15,20,.85)';g.beginPath();g.roundRect(40,380,640,320,28);g.fill();
  g.textAlign='center';g.textBaseline='middle';
  const put=(t,fs,col,y)=>{g.font=`bold ${fs}px "Noto Sans Thai","Sarabun",sans-serif`;g.fillStyle=col;
    wrapTxt(g,t,600).forEach((l,i,a)=>g.fillText(l,360,y+(i-(a.length-1)/2)*fs*1.3))};
  put(name,52,'#fff',455);
  if(price!=null&&price!=='')put('฿'+Number(price).toLocaleString('th-TH'),60,'#ffe600',560);
  put(txt,40,'#fff',645);

}

// ความดังเฉลี่ย (RMS) ของช่วงเสียง 16kHz
function rmsOf(au,a,b){
  const i=Math.max(0,Math.floor(a*16000)),j=Math.min(au.length,Math.ceil(b*16000));if(j<=i)return 0;
  let t=0;for(let k=i;k<j;k++)t+=au[k]*au[k];return Math.sqrt(t/(j-i));
}
const HAL=/(ซับไตเติ้ล|ซับไตเติล|subtitles? by|amara\.org|ถอดความโดย|thanks for watching|ขอบคุณที่รับชม|ขอบคุณที่ติดตามชม)/i;
// ทิ้งช่วงที่เงียบ (Whisper มักแต่งข้อความเองตอนเงียบ) วลีหลอนที่พบบ่อยตอนเสียงเบา และประโยคซ้ำติดกัน
// พร้อมคำนวณเกนปรับความดังของแต่ละช่วงให้ใกล้เคียงกัน (กันเสียงต่างระดับตอนต่อคลิป)
function cleanSegs(segs,au){
  const out=[];let prev='';out.drop={sil:0,hal:0,dup:0,sym:0};
  for(const x of segs){
    const r=rmsOf(au,x.a,x.b);
    if(!/[\u0E00-\u0E7Fa-zA-Z0-9\u3040-\u30FF\u4E00-\u9FFF\uAC00-\uD7AF]/.test(x.t)){out.drop.sym++;continue}
    if(r<0.003){out.drop.sil++;continue}
    if(HAL.test(x.t)&&r<0.02){out.drop.hal++;continue}
    const k=x.t.replace(/\s+/g,'');if(k&&k===prev){out.drop.dup++;continue}prev=k;
    x.g=Math.min(4,Math.max(.4,0.12/Math.max(r,1e-4)));out.push(x);
  }
  return out;
}
// ระดับเสียงพูดของทั้งคลิป (dBFS, เปอร์เซนไทล์ 90 ของช่วง 0.5 วิ) ไว้บอกผู้ใช้ว่าเสียงเบาไปไหม
function levelDb(au){
  const w=8000,v=[];
  for(let i=0;i+w<=au.length;i+=w){let t=0;for(let k=i;k<i+w;k++)t+=au[k]*au[k];v.push(Math.sqrt(t/w))}
  if(!v.length)return -99;v.sort((a,b)=>a-b);return 20*Math.log10(Math.max(1e-5,v[Math.floor(v.length*.9)]));
}
// ตัวกรองเสียงต่อช่วง: ปรับความดัง + กันเสียงแตก + เฟดสั้น ๆ กันเสียงคลิกตรงรอยต่อ
function afc(g,d){
  const a=[];if(Math.abs(g-1)>.02)a.push('volume='+g.toFixed(3));if(g>1)a.push('alimiter=limit=0.97');
  a.push('afade=t=in:d=0.03','afade=t=out:st='+Math.max(0,d-.05).toFixed(2)+':d=0.05');return a.join(',');
}

}
function b64(u){let t='';for(let i=0;i<u.length;i+=0x8000)t+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(t)}
// ดึงภาพนิ่งกลางช่วงของแต่ละช่วงคำพูด (เล็ก ~256px) ให้ AI ดู; pool เรียงตามไฟล์อยู่แล้ว จึงโหลดแต่ละคลิปครั้งเดียว
async function grabFrames(pool,m){
  const out=[],todo=pool.slice(0,60);let loaded=null,n=0,inp='';
  try{
    for(const x of todo){
      if(loaded!==x.p){inp=await inOpen(x.p.file);loaded=x.p}
      m.textContent=`AI กำลังดูภาพ ${++n}/${todo.length}…`;
      try{
        await run(['-ss',((x.s.a+x.s.b)/2).toFixed(2),'-i',inp,'-frames:v','1','-vf','scale=256:-2','-q:v','6','-y','fr.jpg']);
        const d=await ff.readFile('fr.jpg');out.push({id:x.id,img:b64(d)});
      }catch(e){}
      try{await ff.deleteFile('fr.jpg')}catch(e){}
    }
  }finally{if(loaded)await inClose()}
  if(todo.length&&!out.length)throw new Error('ดึงภาพจากคลิปไม่ได้');
  return out;
}
async function autoRun(){
  const files=S.files.slice(),o={...S.opt},m={set textContent(t){setMsg(t)}},
    tl=+o.tl,subsOn=o.as,W=720,H=1280,bh=360,ps=o.ps,
    y=Math.round(ps=='top'?H*.08:ps=='mid'?(H-bh)/2:H-bh-H*.08),prod=S.products.find(p=>p.id==o.apid),vol=+o.vol||1;
  S.autoPid=o.apid;S.autoProd=prod?prod.name:'';S.saving=false;
  S.autoBlob=null;S.pm=null;
  try{
    m.textContent='กำลังโหลด ffmpeg…';await loadFF();await ffClean();await fontsReady();
    S.fontNote=thaiFontOk()?'':' · ฟอนต์ไทยโหลดไม่ได้ ซับอาจเพี้ยน';
    const asr=await getAsr(m,o.md),plans=[],skipped=[],diag=[];
    // A) ถอดเสียงทุกคลิป → ช่วงที่มีคำพูด
    for(let i=0;i<files.length;i++){
      m.textContent=`ถอดเสียงคลิป ${i+1}/${files.length}…`;
      let au;try{au=await audio16k(files[i])}catch(e){
        plans.push({file:files[i],segs:[]});skipped.push(i+1);
        diag.push(`คลิป ${i+1}: `+(/does not contain any stream|no audio|Output file.*does not contain/i.test(errMsg(e))?'ไม่มีแทร็กเสียง':'อ่านเสียงไม่ได้ ('+errMsg(e).slice(0,90)+')'));continue}
      const dur=au.length/16000,ai=S.aIdx;
      let segs=HL.has(o.tp)&&subsOn?await wordSegs(asr,au,o.lg,dur):null;
      if(!segs){
        const r=await asr(au,{language:o.lg,task:'transcribe',return_timestamps:true,chunk_length_s:30,stride_length_s:5});segs=[];
        for(const c of r.chunks||[]){
          const t=c.text.trim();if(!t)continue;
          const a=Math.max(0,c.timestamp[0]-0.1),b=Math.min(dur,(c.timestamp[1]??dur)+0.2);
          if(b-a>=0.5)segs.push(...splitSeg(a,b,t));
        }
      }
      const raw=segs.length;segs=cleanSegs(segs,au);plans.push({file:files[i],segs,ai});
      const lv=levelDb(au),dr=segs.drop||{},why=[dr.sil&&`เงียบ ${dr.sil}`,dr.hal&&`ข้อความหลอน ${dr.hal}`,dr.dup&&`ซ้ำ ${dr.dup}`,dr.sym&&`สัญลักษณ์ ${dr.sym}`].filter(Boolean).join(' ');
      diag.push(`คลิป ${i+1}: `+(raw?`Whisper ได้ ${raw} ช่วง ใช้ได้ ${segs.length}${why?` (ตัดออก: ${why})`:''}`:'Whisper ไม่ได้ยินคำพูด'+(lv<-45?' (เสียงเบามาก ลองอัดใกล้ไมค์ขึ้น)':lv>-8?' (เสียงแตก/ดังเกิน)':' (ตรวจว่าเลือกภาษาพูดถูกหรือไม่ หรือมีเพลง/เสียงรบกวนทับ)'))+` · ระดับเสียง ${Math.round(lv)} dB`);
    }
    // B) ให้ AI คัดช่วงเด็ด+เรียงลำดับ (ล้มเหลว/ปิดอยู่ → ตัดท้ายให้พอดีความยาวแบบเดิม)
    const pool=[];plans.forEach((p,pi)=>p.segs.forEach(s=>pool.push({id:pool.length,pi,p,s})));
    let order=null,frames=[],vnote='';S.aiNote='';
    if(o.dr&&pool.length>1){
      if(o.vis){try{frames=await grabFrames(pool,m)}catch(x){frames=[];vnote=` · ดึงภาพไม่ได้ (${errMsg(x)}) ใช้เฉพาะคำพูด`}}
      try{
        m.textContent='AI กำลังคัดช่วงเด็ดและเรียงลำดับ…';
        const{data,error}=await sb.functions.invoke('clip-director',{body:{target:tl,angle:o.dg,frames,
          product:prod?{name:prod.name,price:prod.price,notes:prod.notes}:null,
          segments:pool.map(x=>({id:x.id,clip:x.pi+1,start:+x.s.a.toFixed(1),end:+x.s.b.toFixed(1),text:x.s.t}))}});
        if(error)throw error;if(!data||data.error)throw new Error(data?data.error:'ไม่มีผลลัพธ์');
        const seen=new Set(),pk=(data.picks||[]).filter(k=>pool[k.id]&&!seen.has(k.id)&&seen.add(k.id));
        if(!pk.length)throw new Error('AI ไม่ได้เลือกช่วงใดเลย');
        order=pk.map(k=>({...pool[k.id],role:k.role,why:k.why}));
        while(order.length>1&&order.reduce((t,x)=>t+x.s.b-x.s.a,0)>tl+.5)order.pop();
        S.autoCap=data.caption||'';S.aiNote=` · AI คัดมา ${order.length}/${pool.length} ช่วง${frames.length?` (ดูภาพ ${frames.length} ช่วง)`:''}`;
      }catch(x){order=null;S.aiNote=` · AI ใช้ไม่ได้ (${errMsg(x)}) ต่อตามลำดับแทน`}
      S.aiNote+=vnote;
    }
    if(!order){
      const psum=()=>plans.reduce((s,p)=>s+p.segs.reduce((x,g)=>x+g.b-g.a,0),0);
      while(psum()>tl){const p=[...plans].reverse().find(p=>p.segs.length);if(!p)break;p.segs.pop();}
      order=plans.flatMap((p,pi)=>p.segs.map(s=>({p,s,pi})));
    }
    const sum=()=>order.reduce((t,x)=>t+x.s.b-x.s.a,0);
    if(!order.length){S.res=null;resUI();return m.textContent='ไม่พบคำพูดในคลิป — '+diag.join(' | ')}
    const lastSeg=order[order.length-1].s;
    S.autoScript=order.map(x=>x.s.t).join('\n');
    S.plan=o.dr&&order[0].role?order.map(x=>({role:x.role,why:x.why||'',t:x.s.t,clip:x.pi+1})):null;
    // C) ตัดแต่ละช่วง + ใส่ซับ/CTA (เข้ารหัสแบบเดียวกันเพื่อให้ต่อกันได้) โหลดไฟล์ใหม่เฉพาะตอนเปลี่ยนคลิปต้นทาง
    const segFiles=[];let n=0,loaded=null,inp='';
    for(const{p,s,pi}of order){
      if(loaded!==p){inp=await inOpen(p.file);loaded=p}
      m.textContent=`ตัดต่อช่วงที่ ${n+1}/${order.length} (คลิป ${pi+1})`;
      const out=`seg${n++}.mp4`,d=s.b-s.a,args=['-ss',s.a.toFixed(2),'-i',inp];
      let f="[0:v]crop='min(iw,ih*9/16)':'min(ih,iw*16/9)',scale=720:1280,fps=30,setsar=1,format=yuv420p[v0]",last='v0',k=1;
      const subN=[];
      if(subsOn){
        const fr=await subFrames(s,W,bh,o,s.a);
        for(let j=0;j<fr.length;j++){
          const nm=`sub${j}.png`;await ff.writeFile(nm,fr[j].png);subN.push(nm);args.push('-i',nm);
          f+=`;[${last}][${k}:v]overlay=0:${y}${fr.length>1?`:enable='${en(fr[j].a,fr[j].b)}'`:''}[v${k}]`;last='v'+k;k++;
        }
      }
      if(s===lastSeg&&prod){
        await ff.writeFile('cta.png',await ctaPng(prod.name,prod.price,o.act));args.push('-i','cta.png');
        f+=`;[${last}][${k}:v]overlay=0:0:enable='gte(t,${Math.max(0,d-3).toFixed(2)})'[v${k}]`;last='v'+k;k++;
      }
      args.push('-t',d.toFixed(2),'-filter_complex',f,'-map',`[${last}]`,'-map',(p.ai!=null?'0:'+p.ai:'0:a?'),'-af',afc(vol*(s.g||1),d),'-c:v','libx264','-preset','ultrafast','-crf','28','-c:a','aac','-ar','44100','-ac','2','-r','30',out);
      await run(args);segFiles.push(out);
      for(const nm of subN)await ff.deleteFile(nm);
    }
    if(loaded)await inClose();
    // D) ต่อทุกช่วง
    m.textContent='กำลังต่อคลิป…';
    await ff.writeFile('list.txt',segFiles.map(f=>`file '${f}'`).join('\n'));
    await run(['-f','concat','-safe','0','-i','list.txt','-c','copy','final.mp4']);
    const d=await ff.readFile('final.mp4');
    for(const f of segFiles)await ff.deleteFile(f);
    S.autoBlob=new Blob([d.buffer],{type:'video/mp4'});const u=URL.createObjectURL(S.autoBlob);
    S.skipNote=(diag.some(d=>/ไม่ได้ยิน|ไม่มีแทร็ก|อ่านเสียงไม่ได้/.test(d))?' · '+diag.filter(d=>/ไม่ได้ยิน|ไม่มีแทร็ก|อ่านเสียงไม่ได้/.test(d)).join(' | '):'')+S.aiNote+(S.fontNote||'');S.res=u;S.saveSt='';resUI();
    m.textContent=`ตัดต่อเสร็จ (${segFiles.length} ช่วง, ~${Math.round(sum())} วิ)`;
    await upAuto();
  }catch(x){m.textContent='ผิดพลาด: '+errMsg(x)}
}
async function upAuto(){
  if(!S.autoBlob||S.saving)return;S.saving=true;S.saveSt='';resUI();
  setMsg('กำลังบันทึกเข้า คลิปของฉัน…');

    const{data:{user}}=await sb.auth.getUser(),path=`${user.id}/${Date.now()}.mp4`;
    const u=await sb.storage.from('clips').upload(path,S.autoBlob,{contentType:'video/mp4'});
    if(u.error)throw u.error;
    const r=await sb.from('clips').insert({title:'ออโต้ '+(S.autoProd?S.autoProd+' ':'')+new Date().toLocaleDateString('th-TH'),product_id:S.autoPid||null,status:'editing',out_path:path,script:S.autoScript,caption:S.autoCap||null});
    if(r.error)throw r.error;

    if(S.tab=='clips'&&!S.cur)cView();

    setMsg(big?'ไฟล์ใหญ่เกินที่ Supabase อนุญาต (แพ็กเกจฟรี 50MB) กดดาวน์โหลดเก็บไว้ แล้วลดความยาว/จำนวนคลิปที่ทำครั้งต่อไป':'บันทึกไม่สำเร็จ: '+errMsg(x));
  }
}
